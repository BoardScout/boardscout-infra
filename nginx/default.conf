# BoardScout 역방향 프록시(boardscout-proxy) 설정
# 호스트에 공개되는 유일한 진입점이며 요청 경로에 따라 내부 서비스로 전달한다.
# 각 서버 이름은 Docker 네트워크 별칭(--network-alias)으로 해석된다.

# 정적 화면 서버
upstream boardscout_web {
    server web:4173;
}

# 핵심 서버(회원·인증·카탈로그·별점) 2대: 요청을 번갈아 보내는 round-robin 분산.
# 로그인 세션이 Redis(session)에 있으므로 어느 서버가 처리해도 같은 사용자로 인식된다.
# 2번 연속 실패하면 10초 동안 제외하고 살아 있는 서버로만 보낸다.
upstream boardscout_core {
    server core-1:8080 max_fails=2 fail_timeout=10s;
    server core-2:8080 max_fails=2 fail_timeout=10s;
}

# 추천 서버
upstream boardscout_recommender {
    server recommender:8000;
}

server {
    listen 80;
    server_name _;

    # 프록시 자체 상태 확인
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 추천 API → 추천 서버
    # /api/v1/ 보다 접두사가 더 길어서 Nginx가 이 블록을 먼저 선택한다(longest prefix match).
    location /api/v1/recommendations/ {
        proxy_pass http://boardscout_recommender;
        include /etc/nginx/proxy_params;
    }

    # 회원·인증·게임·별점 API → 핵심 서버 2대
    location /api/v1/ {
        proxy_pass http://boardscout_core;
        include /etc/nginx/proxy_params;
    }

    # 그 외 모든 요청 → 정적 화면
    location / {
        proxy_pass http://boardscout_web;
        include /etc/nginx/proxy_params;
    }
}
