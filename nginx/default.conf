upstream boardscout_frontend {
    server frontend:4173;
}

upstream boardscout_spring {
    server spring:8080;
}

upstream boardscout_fastapi {
    server fastapi:8000;
}

server {
    listen 80;
    server_name _;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/core/ {
        proxy_pass http://boardscout_spring;
        include /etc/nginx/proxy_params;
    }

    location /api/recommend/ {
        proxy_pass http://boardscout_fastapi;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://boardscout_frontend;
        include /etc/nginx/proxy_params;
    }
}

