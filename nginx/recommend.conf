upstream boardscout_frontend {
    server frontend:4173;
}

upstream boardscout_fastapi {
    server fastapi:8000;
}

server {
    listen 80;
    server_name _;

    location /api/v1/recommendations/ {
        proxy_pass http://boardscout_fastapi;
    }

    location / {
        proxy_pass http://boardscout_frontend;
    }
}
