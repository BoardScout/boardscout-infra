name: boardscout

# 서비스 이름은 Docker 내부 DNS 이름이다. nginx/default.conf 와 환경 변수가 같은 이름을 사용한다.
x-core: &core
  build:
    context: ../spring-server
  environment:
    SPRING_PROFILES_ACTIVE: dev
    MYSQL_HOST: db
    MYSQL_PORT: "3306"
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    REDIS_HOST: session
    REDIS_PORT: "6379"
    SERVER_PORT: "8080"
  depends_on:
    db:
      condition: service_healthy
    session:
      condition: service_healthy
  expose:
    - "8080"
  restart: unless-stopped

services:
  proxy:
    build:
      context: ./nginx
    container_name: boardscout-proxy
    depends_on:
      web:
        condition: service_healthy
      core-1:
        condition: service_healthy
      core-2:
        condition: service_healthy
      recommender:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - public-net
    restart: unless-stopped

  web:
    build:
      context: ../frontend
    container_name: boardscout-web
    expose:
      - "4173"
    networks:
      - public-net
    restart: unless-stopped

  core-1:
    <<: *core
    container_name: boardscout-core-1
    networks:
      public-net:
      private-net:
        aliases: [core]

  core-2:
    <<: *core
    container_name: boardscout-core-2
    # Flyway 마이그레이션이 동시에 실행되지 않도록 core-1 이 정상 기동한 뒤에 시작한다.
    depends_on:
      db:
        condition: service_healthy
      session:
        condition: service_healthy
      core-1:
        condition: service_healthy
    networks:
      public-net:
      private-net:
        aliases: [core]

  recommender:
    build:
      context: ../fastapi-server
    container_name: boardscout-recommender
    environment:
      APP_ENV: container
      CORE_SERVICE_URL: http://core:8080
      REDIS_HOST: session
      REDIS_PORT: "6379"
      MODEL_PATH: /app/models/recommendation-v1.joblib
    depends_on:
      session:
        condition: service_healthy
      core-1:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - public-net
      - private-net
    restart: unless-stopped

  session:
    image: redis:7.4-alpine
    container_name: boardscout-session
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - session-data:/data
    networks:
      - private-net
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: boardscout-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - private-net
    restart: unless-stopped

networks:
  public-net:
  private-net:
    internal: true

volumes:
  db-data:
  session-data:

