name: boardscout-test

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-boardscout}
      MYSQL_USER: ${MYSQL_USER:-boardscout}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-boardscout-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-boardscout-root-local}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_TEST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
    tmpfs:
      - /var/lib/mysql

