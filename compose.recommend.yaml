name: boardscout-recommend-test

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/recommend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      fastapi:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    expose:
      - "4173"

  fastapi:
    build:
      context: ../fastapi-server
    expose:
      - "8000"

